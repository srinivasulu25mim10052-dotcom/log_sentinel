[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.0"
description = "Automated Server Log Incident Diagnostics & Threat Detection Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LogSentinel Team" }
]
keywords = ["log-analysis", "security", "incident-detection", "devops", "pure-python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
    "Topic :: Security",
]

[project.scripts]
logsentinel = "sentinel.cli:main"
log-sentinel = "sentinel.cli:main"
